name: Rehost Product Image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Original product image URL"
        required: true
        type: string
      file_name:
        description: "Output file name without extension"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rehost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download original product image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          mkdir -p generated

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0" \
            -e "https://www.google.com/" \
            "$IMAGE_URL" \
            -o original_image

      - name: Validate downloaded image
        run: |
          file original_image
          identify original_image

      - name: Convert image for Meta
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          convert original_image \
            -auto-orient \
            -background white \
            -alpha remove \
            -alpha off \
            -strip \
            -quality 92 \
            "generated/${FILE_NAME}.jpg"

      - name: Commit generated image
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "generated/${FILE_NAME}.jpg"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rehost ${FILE_NAME}"
            git push
          fi
