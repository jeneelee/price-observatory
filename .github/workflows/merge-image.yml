      - name: Create final image
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          mkdir -p generated

          # 상품 이미지: 확대 허용, 1080x1080 안에서 최대한 크게
          convert product_image \
            -auto-orient \
            -resize "980x980" \
            -background white \
            -gravity center \
            -extent 1080x1080 \
            product_ready.png

          # 애드픽 고지 이미지:
          # 투명 부분은 흰색 처리 + 폭 850px로 축소
          convert adpicksponser_03.png \
            -auto-orient \
            -background white \
            -alpha background \
            -resize "850x>" \
            notice_small.png

          # 고지 이미지를 1080px 흰 배경 가운데 배치
          convert \
            -size 1080x220 xc:white \
            notice_small.png \
            -gravity center \
            -composite \
            notice_ready.png

          # 상품 이미지 + 작은 고지 배너 합성
          convert product_ready.png notice_ready.png \
            -append \
            -background white \
            -alpha remove \
            -alpha off \
            "generated/${FILE_NAME}.jpg"
