name: Merge Product Image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Adpick product image URL"
        required: true
        type: string
      file_name:
        description: "Output file name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download product image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            "$IMAGE_URL" \
            -o product_image

      - name: Create final image
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          mkdir -p generated

          # 상품 이미지를 SNS용 1080px 정사각형 영역으로 정리
          convert product_image \
            -auto-orient \
            -resize "1080x1080>" \
            -background white \
            -gravity center \
            -extent 1080x1080 \
            product_ready.png

          # 고지 이미지를 상품 이미지와 같은 폭으로 조정
          convert adpicksponser_03.png \
            -auto-orient \
            -resize "1080x>" \
            notice_ready.png

          # 상품 이미지 위 + 고지 이미지 아래
          convert product_ready.png notice_ready.png \
            -append \
            "generated/${FILE_NAME}.jpg"

      - name: Commit generated image
        env:
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "generated/${FILE_NAME}.jpg"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate ${FILE_NAME}"
            git push
          fi
